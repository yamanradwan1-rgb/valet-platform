name: Bug report
description: Report a reproducible Valet Platform defect
title: "[BUG] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps and relevant data/state.
      placeholder: |
        1. Session is PARKED
        2. Customer requests vehicle twice
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options:
        - Normal application bug
        - ValetSession state machine
        - Database integrity
        - Tenant isolation / authorization
        - Handoff / OTP security
        - Payment
        - Vehicle evidence / photos
        - Unknown
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, failing test, request ID, or other non-secret evidence.

  - type: checkboxes
    id: privacy
    attributes:
      label: Sensitive data check
      options:
        - label: I did not include passwords, plaintext OTPs, customer access tokens, card data, or unnecessary customer PII.
          required: true
