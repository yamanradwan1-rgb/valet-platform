name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-build:
    name: static-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build contract proof
        run: pnpm test:build-contract

      - name: Deterministic verification build
        run: pnpm build

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test harness safety and ownership
        run: node --test scripts/test-harness/*.test.mjs

      - name: Install Playwright Chromium for browser-backed unit tests
        run: pnpm --filter @valet/dashboard exec playwright install chromium

      - name: Run non-PostgreSQL tests
        run: pnpm test:non-postgres

  postgres:
    name: postgres-${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - api
          - database
    env:
      DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - 5432:5432
        options: >-
          --label "vaylet.issue215.disposable=true"
          --label "vaylet.issue215.run-id=${{ github.run_id }}"
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run bounded PostgreSQL lane
        env:
          VAYLET_ISSUE215_TEST_TARGET: ci
          VAYLET_ISSUE215_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm run test:postgres:${{ matrix.lane }}

  platform:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture check
        run: pnpm architecture:check

      - name: Run platform-sensitive checks
        run: pnpm test:platform

  employee-e2e:
    name: employee-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://valet_runtime:valet_runtime_e2e@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      API_ORIGIN: http://localhost:3001
      E2E_APPROVED_DATABASE: valet
      E2E_FIXTURE_CONFIRM: employee-e2e
      E2E_LOCATION_ID: e2e00000-0000-4000-8000-000000000001
      E2E_STAFF_EMAIL: e2e-driver@valet.test
      E2E_STAFF_PASSWORD: e2e-secure-password-123
      STAFF_AUTH_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3003
      ANTI_ABUSE_HMAC_SECRET_B64URL: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      HANDOFF_VERIFIER_HMAC_SECRET_B64URL: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      MFA_TOTP_ENCRYPTION_KEY_B64URL: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      MFA_RECOVERY_HMAC_SECRET_B64URL: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      STAFF_PUSH_RETRIEVAL_CREATION_ENABLED: "false"
      STAFF_PUSH_WORKER_SENDING_ENABLED: "false"
      STAFF_PUSH_RETRIEVAL_POLICY_VERSION: "1"
      STAFF_PUSH_RETRIEVAL_INTENT_TTL_SECONDS: "300"
      STAFF_PUSH_RETRIEVAL_MAX_ATTEMPTS: "4"
      STAFF_PUSH_PROVIDER_CALL_TIMEOUT_SECONDS: "10"
      STAFF_PUSH_LEASE_DURATION_SECONDS: "30"
      STAFF_PUSH_RETRY_MINIMUM_SECONDS: "10"
      STAFF_PUSH_RETRY_CAP_SECONDS: "60"
      STAFF_PUSH_INTENT_DELIVERY_RETENTION_DAYS: "7"
      STAFF_PUSH_TERMINAL_REGISTRATION_RETENTION_DAYS: "30"
      STAFF_PUSH_ACTIVE_REGISTRATION_STALE_DAYS: "30"
      STAFF_PUSH_CLEANUP_INTERVAL_HOURS: "24"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @valet/database migrate:deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet

      - name: Provision runtime role
        run: pnpm --filter @valet/database runtime:provision
        env:
          DATABASE_URL: postgresql://valet_runtime:valet_runtime_e2e@localhost:5432/valet
          MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet

      - name: Build contracts for E2E fixture imports
        run: pnpm --filter @valet/contracts build

      - name: Provision E2E fixtures
        run: pnpm --filter @valet/api exec tsx tools/e2e/provision-employee-e2e.ts
        env:
          DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
          NODE_ENV: test
          E2E_APPROVED_DATABASE: valet
          E2E_FIXTURE_CONFIRM: employee-e2e
          E2E_STAFF_EMAIL: e2e-driver@valet.test
          E2E_STAFF_PASSWORD: e2e-secure-password-123

      - name: Build API
        run: pnpm --filter @valet/api build

      - name: Install Playwright Chromium
        run: pnpm --filter @valet/valet exec playwright install chromium

      - name: Start API server
        run: |
          pnpm --filter @valet/api start &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

      - name: Start Valet app
        run: |
          pnpm --filter @valet/valet dev &
          vready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              vready=1
              break
            fi
            sleep 1
          done
          test "$vready" = "1"

      - name: Run E2E tests
        run: pnpm --filter @valet/valet test:e2e
        env:
          E2E_API_URL: http://localhost:3001
          E2E_BASE_URL: http://localhost:3000

      - name: Provision Management Dashboard E2E fixtures
        run: pnpm --filter @valet/api exec tsx tools/e2e/provision-management-dashboard-e2e.ts
        env:
          NODE_ENV: test
          E2E_FIXTURE_CONFIRM: management-dashboard-e2e

      - name: Start Dashboard app
        run: |
          pnpm --filter @valet/dashboard dev &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3003/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

      - name: Run Management Dashboard runtime E2E
        run: pnpm --filter @valet/dashboard test:e2e:runtime
        env:
          E2E_BASE_URL: http://localhost:3003

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - static-build
      - unit
      - postgres
      - platform
      - employee-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert required jobs succeeded
        env:
          STATIC_BUILD_RESULT: ${{ needs.static-build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          EMPLOYEE_E2E_RESULT: ${{ needs.employee-e2e.result }}
        run: |
          failed=0
          for name in STATIC_BUILD UNIT POSTGRES PLATFORM EMPLOYEE_E2E; do
            result_name="${name}_RESULT"
            result="${!result_name}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
