name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
