name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      API_ORIGIN: http://localhost:3001

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  employee-e2e:
    name: employee-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://valet_runtime:valet_runtime_e2e@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      API_ORIGIN: http://localhost:3001
      E2E_APPROVED_DATABASE: valet
      E2E_FIXTURE_CONFIRM: employee-e2e
      E2E_LOCATION_ID: e2e00000-0000-4000-8000-000000000001
      E2E_STAFF_EMAIL: e2e-driver@valet.test
      E2E_STAFF_PASSWORD: e2e-secure-password-123
      STAFF_AUTH_ALLOWED_ORIGINS: http://localhost:3000
      ANTI_ABUSE_HMAC_SECRET_B64URL: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      HANDOFF_VERIFIER_HMAC_SECRET_B64URL: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @valet/database migrate:deploy
        env:
          MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet

      - name: Provision runtime role
        run: pnpm --filter @valet/database runtime:provision
        env:
          DATABASE_URL: postgresql://valet_runtime:valet_runtime_e2e@localhost:5432/valet
          MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet

      - name: Provision E2E fixtures
        run: pnpm --filter @valet/api exec tsx tools/e2e/provision-employee-e2e.ts
        env:
          DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
          NODE_ENV: test
          E2E_APPROVED_DATABASE: valet
          E2E_FIXTURE_CONFIRM: employee-e2e
          E2E_STAFF_EMAIL: e2e-driver@valet.test
          E2E_STAFF_PASSWORD: e2e-secure-password-123

      - name: Build API
        run: pnpm --filter @valet/api build

      - name: Install Playwright Chromium
        run: pnpm --filter @valet/valet exec playwright install chromium

      - name: Start API server
        run: |
          pnpm --filter @valet/api start &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

      - name: Start Valet app
        run: |
          pnpm --filter @valet/valet dev &
          vready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              vready=1
              break
            fi
            sleep 1
          done
          test "$vready" = "1"

      - name: Run E2E tests
        run: pnpm --filter @valet/valet test:e2e
        env:
          E2E_API_URL: http://localhost:3001
          E2E_BASE_URL: http://localhost:3000
