name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-build:
    name: static-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture check
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build contract proof
        run: pnpm test:build-contract

      - name: Deterministic verification build
        run: pnpm build

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify test harness safety and ownership
        run: node --test scripts/test-harness/*.test.mjs

      - name: Install Playwright Chromium for browser-backed unit tests
        run: pnpm --filter @valet/dashboard exec playwright install chromium

      - name: Run non-PostgreSQL tests
        run: pnpm test:non-postgres

  postgres:
    name: postgres-${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: api-standard
            project: api-postgres-standard
            timeoutMinutes: 45
          - lane: api-compound
            project: api-postgres-compound
            timeoutMinutes: 20
          - lane: api-race
            project: api-postgres-race
            timeoutMinutes: 30
          - lane: database
            timeoutMinutes: 30
          - lane: issue215
            timeoutMinutes: 20
    env:
      DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      MIGRATION_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --label "vaylet.issue215.disposable=true"
          --label "vaylet.issue215.run-id=${{ github.run_id }}"
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Contracts for protected Issue 215 Nest subprocess
        if: ${{ matrix.lane == 'issue215' }}
        run: pnpm --filter @valet/contracts build

      - name: Build API for protected Issue 215 Nest subprocess
        if: ${{ matrix.lane == 'issue215' }}
        run: pnpm --filter @valet/api build

      # Pre-create fixed NOLOGIN owners once in each disposable CI service.
      - name: Attest and pre-provision shared Issue416 CI owners
        env:
          TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          POSTGRES_LANE: ${{ matrix.lane }}
        shell: bash
        run: |
          test "$CI" = "true"
          test -n "$TEST_PG_CONTAINER"
          test "$(docker context inspect "$(docker context show)" --format '{{.Endpoints.docker.Host}}')" = "unix:///var/run/docker.sock"
          metadata="$(docker inspect --format '{{.Config.Image}}|{{index .Config.Labels "vaylet.issue215.disposable"}}|{{index .Config.Labels "vaylet.issue215.run-id"}}|{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}|{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$TEST_PG_CONTAINER")"
          test "$metadata" = "postgres:17-alpine|true|$EXPECTED_RUN_ID|127.0.0.1|5432"
          IFS='|' read -r version system_id database principal < <(
            docker exec "$TEST_PG_CONTAINER" psql -X -U valet -d valet -tAc "SELECT current_setting('server_version_num'), system_identifier, current_database(), current_user FROM pg_control_system()"
          )
          test "$version" -ge 170000
          test "$version" -lt 180000
          [[ "$system_id" =~ ^[0-9]+$ ]]
          test "$database:$principal" = "valet:valet"
          docker exec "$TEST_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U valet -d valet -c \
            'CREATE ROLE vaylet_staff_session_lock_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
          if [[ "$POSTGRES_LANE" == "database" ]]; then
            docker exec "$TEST_PG_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U valet -d valet \
              -c 'CREATE ROLE vap1_proof_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS' \
              -c 'GRANT vap1_proof_owner TO valet WITH INHERIT FALSE, SET TRUE'
          fi

      - name: Run bounded PostgreSQL API project
        if: ${{ startsWith(matrix.lane, 'api-') }}
        env:
          POSTGRES_PROJECT: ${{ matrix.project }}
          VAYLET_ISSUE215_TEST_TARGET: ci
          VAYLET_ISSUE215_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          # Diagnostic-only phase timings; no database name, credentials or URLs.
          VAYLET_PG_FIXTURE_TIMING: "1"
        run: pnpm --filter @valet/api exec node ../../scripts/test-harness/run-postgres-projects.mjs vitest.config.mjs "$POSTGRES_PROJECT"

      - name: Run bounded PostgreSQL database lane
        if: ${{ matrix.lane == 'database' }}
        env:
          VAYLET_ISSUE215_TEST_TARGET: ci
          VAYLET_ISSUE215_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm run test:postgres:database

      - name: Start attested Issue 215 private S3 fixture
        if: ${{ matrix.lane == 'issue215' }}
        run: node scripts/issue215-local-s3/start.mjs

      - name: Run protected Issue 215 API PostgreSQL tests
        if: ${{ matrix.lane == 'issue215' }}
        env:
          VAYLET_ISSUE215_TEST_TARGET: ci
          VAYLET_ISSUE215_CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node scripts/test-harness/run-issue215-ci-api.mjs

      - name: Remove attested Issue 215 private S3 fixture
        if: ${{ always() && matrix.lane == 'issue215' }}
        run: node scripts/issue215-local-s3/stop.mjs

  platform:
    name: platform-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture check
        run: pnpm architecture:check

      - name: Run platform-sensitive checks
        run: pnpm test:platform

  employee-e2e:
    name: employee-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://valet_runtime:valet_runtime_e2e@localhost:5432/valet
      TEST_DATABASE_URL: postgresql://valet:valet@localhost:5432/valet
      API_ORIGIN: http://localhost:3001
      E2E_APPROVED_DATABASE: valet
      E2E_FIXTURE_CONFIRM: employee-e2e
      E2E_LOCATION_ID: e2e00000-0000-4000-8000-000000000001
      E2E_STAFF_EMAIL: e2e-driver@valet.test
      E2E_STAFF_PASSWORD: e2e-secure-password-123
      STAFF_AUTH_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3003
      ANTI_ABUSE_HMAC_SECRET_B64URL: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      HANDOFF_VERIFIER_HMAC_SECRET_B64URL: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE
      MFA_TOTP_ENCRYPTION_KEY_B64URL: AgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgI
      MFA_RECOVERY_HMAC_SECRET_B64URL: AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM
      MFA_PROTECTED_WRITER_ENABLED: "true"
      STAFF_PUSH_RETRIEVAL_CREATION_ENABLED: "false"
      STAFF_PUSH_WORKER_SENDING_ENABLED: "false"
      STAFF_PUSH_RETRIEVAL_POLICY_VERSION: "1"
      STAFF_PUSH_RETRIEVAL_INTENT_TTL_SECONDS: "300"
      STAFF_PUSH_RETRIEVAL_MAX_ATTEMPTS: "4"
      STAFF_PUSH_PROVIDER_CALL_TIMEOUT_SECONDS: "10"
      STAFF_PUSH_LEASE_DURATION_SECONDS: "30"
      STAFF_PUSH_RETRY_MINIMUM_SECONDS: "10"
      STAFF_PUSH_RETRY_CAP_SECONDS: "60"
      STAFF_PUSH_INTENT_DELIVERY_RETENTION_DAYS: "7"
      STAFF_PUSH_TERMINAL_REGISTRATION_RETENTION_DAYS: "30"
      STAFF_PUSH_ACTIVE_REGISTRATION_STALE_DAYS: "30"
      STAFF_PUSH_CLEANUP_INTERVAL_HOURS: "24"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: valet
          POSTGRES_PASSWORD: valet
          POSTGRES_DB: valet
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --label "vaylet.employee-e2e.run-id=${{ github.run_id }}"
          --health-cmd "pg_isready -U valet -d valet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Option C E2E database identities
        env:
          E2E_PG_CONTAINER: ${{ job.services.postgres.id }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          test "$CI" = "true"
          test -n "$E2E_PG_CONTAINER"
          test "$(docker context inspect "$(docker context show)" --format '{{.Endpoints.docker.Host}}')" = "unix:///var/run/docker.sock"
          metadata="$(docker inspect --format '{{.Config.Image}}|{{index .Config.Labels "vaylet.employee-e2e.run-id"}}|{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostIp}}|{{(index (index .NetworkSettings.Ports "5432/tcp") 0).HostPort}}' "$E2E_PG_CONTAINER")"
          test "$metadata" = "postgres:17-alpine|$EXPECTED_RUN_ID|127.0.0.1|5432"
          IFS='|' read -r version system_id database principal < <(
            docker exec "$E2E_PG_CONTAINER" psql -X -U valet -d valet -tAc "SELECT current_setting('server_version_num'), system_identifier, current_database(), current_user FROM pg_control_system()"
          )
          test "$version" -ge 170000
          test "$version" -lt 180000
          [[ "$system_id" =~ ^[0-9]+$ ]]
          test "$database:$principal" = "valet:valet"
          migrator_password="$(openssl rand -hex 32)"
          management_password="$(openssl rand -hex 32)"
          staff_auth_password="$(openssl rand -hex 32)"
          mfa_password="$(openssl rand -hex 32)"
          mfa_activity_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          s04_key="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))')"
          for value in "$migrator_password" "$management_password" "$staff_auth_password" "$mfa_password" "$mfa_activity_key" "$s04_key"; do
            printf '::add-mask::%s\n' "$value"
          done
          docker exec -i "$E2E_PG_CONTAINER" psql -X -U valet -d valet -v ON_ERROR_STOP=1 <<SQL
          CREATE ROLE valet_e2e_migrator LOGIN PASSWORD '$migrator_password' NOINHERIT CREATEROLE NOSUPERUSER NOCREATEDB NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE valet OWNER TO valet_e2e_migrator;
          ALTER SCHEMA public OWNER TO valet_e2e_migrator;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
          {
            printf 'MIGRATION_DATABASE_URL=postgresql://valet_e2e_migrator:%s@localhost:5432/valet\n' "$migrator_password"
            printf 'MANAGEMENT_WRITER_DATABASE_URL=postgresql://vaylet_management_writer:%s@localhost:5432/valet\n' "$management_password"
            printf 'STAFF_AUTH_WRITER_DATABASE_URL=postgresql://vaylet_staff_auth_writer:%s@localhost:5432/valet\n' "$staff_auth_password"
            printf 'MFA_WRITER_DATABASE_URL=postgresql://vaylet_mfa_writer:%s@localhost:5432/valet\n' "$mfa_password"
            printf 'MFA_ACTIVITY_PROOF_SECRET_B64URL=%s\n' "$mfa_activity_key"
            printf 'ANTI_ABUSE_SQL_PROOF_SECRET_B64URL=%s\n' "$s04_key"
          } >> "$GITHUB_ENV"

      - name: Run database migrations
        run: pnpm --filter @valet/database migrate:deploy
        env:
          # This is a disposable CI PostgreSQL service, never a production rollout.
          NODE_ENV: test

      - name: Provision E2E runtime and writer roles
        run: |
          pnpm --filter @valet/database exec node scripts/provision-s04-proof-key.mjs
          pnpm --filter @valet/database runtime:provision
          pnpm --filter @valet/database staff-auth-writer:provision
        env:
          NODE_ENV: test

      - name: Cut over the disposable E2E database to Option C
        run: pnpm --filter @valet/database exec node scripts/provision-option-c-protected-cutover.mjs
        env:
          NODE_ENV: test
          OPTION_C_PROTECTED_CUTOVER: "1"
          OPTION_C_LEGACY_WORKERS_DRAINED: "1"

      - name: Build contracts for E2E fixture imports
        run: pnpm --filter @valet/contracts build

      - name: Provision E2E fixtures
        run: DATABASE_URL="$MIGRATION_DATABASE_URL" pnpm --filter @valet/api exec tsx tools/e2e/provision-employee-e2e.ts
        env:
          NODE_ENV: test
          E2E_APPROVED_DATABASE: valet
          E2E_FIXTURE_CONFIRM: employee-e2e
          E2E_STAFF_EMAIL: e2e-driver@valet.test
          E2E_STAFF_PASSWORD: e2e-secure-password-123

      - name: Build API
        run: pnpm --filter @valet/api build

      - name: Install Playwright Chromium
        run: pnpm --filter @valet/valet exec playwright install chromium

      - name: Start API server
        run: |
          pnpm --filter @valet/api start &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

      - name: Start Valet app
        run: |
          pnpm --filter @valet/valet dev &
          vready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              vready=1
              break
            fi
            sleep 1
          done
          test "$vready" = "1"

      - name: Run E2E tests
        run: pnpm --filter @valet/valet test:e2e
        env:
          E2E_API_URL: http://localhost:3001
          E2E_BASE_URL: http://localhost:3000

      - name: Provision Management Dashboard E2E fixtures
        run: pnpm --filter @valet/api exec tsx tools/e2e/provision-management-dashboard-e2e.ts
        env:
          NODE_ENV: test
          E2E_FIXTURE_CONFIRM: management-dashboard-e2e

      - name: Start Dashboard app
        run: |
          pnpm --filter @valet/dashboard dev &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3003/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

      - name: Run Management Dashboard runtime E2E
        run: pnpm --filter @valet/dashboard test:e2e:runtime
        env:
          E2E_BASE_URL: http://localhost:3003

  quality:
    name: quality
    if: ${{ always() }}
    needs:
      - static-build
      - unit
      - postgres
      - platform
      - employee-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert required jobs succeeded
        env:
          STATIC_BUILD_RESULT: ${{ needs.static-build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          EMPLOYEE_E2E_RESULT: ${{ needs.employee-e2e.result }}
        run: |
          failed=0
          for name in STATIC_BUILD UNIT POSTGRES PLATFORM EMPLOYEE_E2E; do
            result_name="${name}_RESULT"
            result="${!result_name}"
            echo "${name}: ${result}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done
          exit "${failed}"
