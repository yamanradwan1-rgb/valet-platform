name: Manual Security Audit

# Temporary isolated readback branch only. No scans, uploads or writes.
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        default: static
        options: [all, static, dast]
      active_api_scan:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pull-requests: read
  security-events: read
jobs:
  native-readback-diagnostic:
    if: github.repository == 'yamanradwan1-rgb/valet-platform' && github.ref == 'refs/heads/security/native-readback-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read historical CodeQL analysis without mutations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/security/native_readback_diagnostic.py
