name: Android tailnet QA APK

on:
  push:
    branches:
      - fix/local-native-battery-module-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_DOTENV: "1"
      NODE_ENV: production
      BABEL_ENV: production
      EXPO_PUBLIC_API_ORIGIN: https://desktop-tf1j9lh.tail439ebf.ts.net
      EXPO_PUBLIC_CUSTOMER_APP_ORIGIN: https://desktop-tf1j9lh.tail439ebf.ts.net:8443
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @valet/contracts build

      - name: Generate Android project
        run: pnpm --filter @valet/valet-native prebuild:android

      - name: Build standalone QA APK
        working-directory: apps/valet-native/android
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain

      - name: Upload QA APK (development signing only)
        uses: actions/upload-artifact@v4
        with:
          name: vaylet-employee-tailnet-qa-apk
          path: apps/valet-native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
