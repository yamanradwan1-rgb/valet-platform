name: vaylet-issue416-w9

services:
  postgres:
    image: postgres:17-alpine
    container_name: vaylet-issue416-w9-pg17
    labels:
      vaylet.environment: isolated-test
      vaylet.issue: "416"
      vaylet.owner: worker-9
      vaylet.disposable: "true"
    environment:
      POSTGRES_USER: issue416_w9_owner
      POSTGRES_PASSWORD: fixture_w9_owner_only
      POSTGRES_DB: issue416_w9_db
    ports:
      - "127.0.0.1:55416:5432"
    volumes:
      - issue416_w9_pg_data:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-issue416-w9-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue416_w9_owner -d issue416_w9_db"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  issue416_w9_pg_data:
    name: vaylet-issue416-w9-pg17-data
    labels:
      vaylet.environment: isolated-test
      vaylet.issue: "416"
      vaylet.owner: worker-9
      vaylet.disposable: "true"
