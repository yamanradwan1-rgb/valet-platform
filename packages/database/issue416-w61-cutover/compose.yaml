name: vaylet-issue416-w61-cutover
services:
  pg17:
    image: postgres:17-alpine
    container_name: vaylet-issue416-w61-cutover-pg17
    labels:
      vaylet.environment: isolated-test
      vaylet.owner: worker-61
      vaylet.issue: "416"
      vaylet.scope: option-c-protected-cutover
      vaylet.disposable: "true"
    environment:
      POSTGRES_USER: issue416_w61_owner
      POSTGRES_PASSWORD: ${ISSUE416_W61_OWNER_PASSWORD:?Synthetic owner password required}
      POSTGRES_DB: issue416_w61_cutover
    ports:
      - "127.0.0.1:45561:5432"
    volumes:
      - w61_cutover_pg17_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U issue416_w61_owner -d issue416_w61_cutover]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  w61_cutover_pg17_data:
    name: vaylet-issue416-w61-cutover-data
    labels:
      vaylet.environment: isolated-test
      vaylet.owner: worker-61
      vaylet.disposable: "true"
