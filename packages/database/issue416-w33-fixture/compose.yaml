name: vaylet-issue416-w33
services:
  postgres:
    image: postgres:17-alpine
    container_name: vaylet-issue416-w33-pg17
    network_mode: none
    labels:
      vaylet.environment: isolated-test
      vaylet.issue: "416"
      vaylet.owner: worker-33
      vaylet.disposable: "true"
    environment:
      POSTGRES_USER: issue416_w33_owner
      POSTGRES_PASSWORD: ${ISSUE416_W33_FIXTURE_PASSWORD:?Set a disposable synthetic password}
      POSTGRES_DB: issue416_w33_db
    volumes:
      - issue416_w33_pg_data:/var/lib/postgresql/data
      - ./init-roles.sql:/docker-entrypoint-initdb.d/01-issue416-w33-roles.sql:ro
      - ../prisma/migrations:/tmp/w33-migrations:ro
      - ./apply-sql-in-order.sh:/tmp/w33-apply.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issue416_w33_owner -d issue416_w33_db"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  issue416_w33_pg_data:
    name: vaylet-issue416-w33-pg17-data
    labels:
      vaylet.environment: isolated-test
      vaylet.issue: "416"
      vaylet.owner: worker-33
      vaylet.disposable: "true"
